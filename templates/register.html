<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0817;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .register-container {
            max-width: 450px;
            width: 100%;
            background: #120f24;
            padding: 40px 35px;
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(167, 139, 250, 0.12);
            border: 1px solid #2a1f4a;
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .register-container h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 4px;
        }
        .register-container .subtitle {
            color: #8a7ba8;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .register-container .subtitle i {
            color: #4ade80;
            margin-right: 6px;
        }
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        .form-group label {
            display: block;
            color: #c4b5d4;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-group label i {
            color: #4ade80;
            margin-right: 6px;
            width: 18px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border-radius: 14px;
            border: 1px solid #2a1f4a;
            background: #0a0817;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4ade80;
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
        }
        .form-group .input-icon {
            position: absolute;
            left: 14px;
            top: 42px;
            color: #5a4a7a;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .form-group input:focus + .input-icon {
            color: #4ade80;
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: #7c3aed;
            color: #fff;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
            margin-top: 6px;
        }
        .btn-register:hover {
            background: #6d28d9;
            transform: scale(1.02);
            box-shadow: 0 0 35px rgba(124, 58, 237, 0.5);
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #8a7ba8;
            font-size: 0.9rem;
        }
        .login-link a {
            color: #4ade80;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .flash-message {
            background: #2a1f4a;
            padding: 10px 16px;
            border-radius: 12px;
            color: #fbbf24;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border-left: 3px solid #fbbf24;
        }
        .back-link {
            display: inline-block;
            margin-top: 14px;
            color: #8a7ba8;
            text-decoration: none;
            font-size: 0.85rem;
            text-align: center;
            width: 100%;
        }
        .back-link:hover {
            color: #4ade80;
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            color: #5a4a7a;
            font-size: 0.8rem;
        }
        .password-hint {
            font-size: 0.8rem;
            color: #5a4a7a;
            margin-top: 4px;
            display: block;
        }
        .password-hint i {
            margin-right: 4px;
        }
        @media (max-width: 480px) {
            .register-container {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>📝 Регистрация</h1>
        <div class="subtitle">
            <i class="fas fa-shield-alt"></i> Создайте аккаунт в Swill Monitor
        </div>

        <!-- ===== СООБЩЕНИЯ ===== -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-message">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- ===== ФОРМА РЕГИСТРАЦИИ ===== -->
        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Логин</label>
                <input type="text" id="username" name="username" placeholder="Придумайте логин" required>
                <i class="fas fa-user input-icon"></i>
            </div>

            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" name="email" placeholder="Ваш email" required>
                <i class="fas fa-envelope input-icon"></i>
            </div>

            <div class="form-group">
                <label for="phone"><i class="fas fa-phone"></i> Телефон</label>
                <input type="text" id="phone" name="phone" placeholder="+7 (999) 123-45-67">
                <i class="fas fa-phone input-icon"></i>
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Пароль</label>
                <input type="password" id="password" name="password" placeholder="Минимум 6 символов" required>
                <i class="fas fa-lock input-icon"></i>
                <span class="password-hint"><i class="fas fa-info-circle"></i> Минимум 6 символов</span>
            </div>

            <button type="submit" class="btn-register">
                <i class="fas fa-user-plus"></i> Зарегистрироваться
            </button>
        </form>

        <div class="login-link">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </div>

        <a href="/" class="back-link">
            <i class="fas fa-arrow-left"></i> Вернуться на сайт
        </a>

        <div class="footer">
            Eliot Cross · 2026
        </div>
    </div>
</body>
</html>
